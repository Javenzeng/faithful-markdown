<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Faithful Markdown</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --line: #e5e7eb;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --danger: #b91c1c;
      --code-bg: #f6f8fa;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 8px;
      padding: 7px 12px;
      cursor: pointer;
      font: inherit;
    }
    button:hover { background: #f9fafb; }
    button.primary { background: var(--accent); border-color: var(--accent); color: white; }
    button.mode.active { background: var(--accent-soft); border-color: #bfdbfe; color: #1d4ed8; }
    #app { display: flex; flex-direction: column; height: 100%; }
    [hidden] { display: none !important; }
    #toolbar { min-height: 52px; flex-wrap: wrap; }
    #statusbar { min-height: 28px; }
    #findbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
    #findInput { min-width: 160px; padding: 7px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
    #content { display: flex; flex: 1; min-height: 0; }
    #outline { width: 210px; flex-shrink: 0; overflow: auto; padding: 12px; border-right: 1px solid var(--line); background: var(--panel); }
    #outline button { display: block; width: 100%; border: 0; text-align: left; overflow-wrap: anywhere; padding: 6px 8px; }
    #outline p { color: var(--muted); }
    #splitter { cursor: col-resize; background: var(--line); touch-action: none; }
    #splitter:hover, #splitter:focus { background: var(--accent); }
    #preview mark { background: #fef08a; color: inherit; }
    #preview mark.current { background: #fb923c; }
    #toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }
    .separator { width: 1px; height: 24px; background: var(--line); margin: 0 4px; }
    #fileName {
      margin-left: auto;
      max-width: 38vw;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      color: var(--muted);
    }
    #workspace { flex: 1; min-width: 0; min-height: 0; display: grid; --split: 50%; grid-template-columns: minmax(0, var(--split)) 6px minmax(0, 1fr); }
    #editorPane, #previewPane { min-width: 0; min-height: 0; background: var(--panel); }
    #editorPane { border-right: 1px solid var(--line); }
    #editor {
      width: 100%; height: 100%; resize: none; border: 0; outline: 0;
      padding: 24px 26px 48px;
      background: #fbfcfe; color: #111827;
      font: 14px/1.65 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      tab-size: 4;
    }
    #previewPane { overflow: auto; }
    #preview {
      max-width: 900px;
      margin: 0 auto;
      padding: 34px 46px 80px;
      font-size: 16px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }
    #preview h1, #preview h2, #preview h3, #preview h4 { line-height: 1.3; margin: 1.4em 0 .7em; }
    #preview h1, #preview h2 { border-bottom: 1px solid var(--line); padding-bottom: .3em; }
    #preview h1 { font-size: 2em; }
    #preview h2 { font-size: 1.5em; }
    #preview h3 { font-size: 1.25em; }
    #preview p, #preview ul, #preview ol, #preview blockquote, #preview table, #preview pre { margin: 0 0 1em; }
    #preview a { color: #0969da; text-decoration: none; }
    #preview a:hover { text-decoration: underline; }
    #preview blockquote { margin-left: 0; padding: .2em 1em; color: #57606a; border-left: .25em solid #d0d7de; }
    #preview code { background: var(--code-bg); border-radius: 5px; padding: .15em .35em; font-size: 85%; }
    #preview pre { overflow: auto; background: var(--code-bg); border-radius: 8px; padding: 16px; }
    #preview pre code { padding: 0; background: transparent; }
    #preview table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; }
    #preview th, #preview td { border: 1px solid #d0d7de; padding: 6px 13px; }
    #preview tr:nth-child(2n) { background: #f6f8fa; }
    #preview img { display: block; max-width: 100%; height: auto; margin: 20px auto; border-radius: 8px; box-shadow: 0 4px 12px rgba(0,0,0,.12); }
    #preview input[type="checkbox"] { margin-right: .5em; }
    #statusbar {
      display: flex; align-items: center; gap: 10px; padding: 0 12px;
      border-top: 1px solid var(--line); background: var(--panel); color: var(--muted); font-size: 12px;
    }
    #dirtyIndicator.dirty { color: #b45309; font-weight: 600; }
    #message { margin-left: auto; color: var(--muted); }
    #message.error { color: var(--danger); }
    body.reader #workspace { grid-template-columns: 1fr; }
    body.reader #editorPane { display: none; }
    body.reader #splitter { display: none; }
    body.reader #preview { max-width: 980px; }
    @media (max-width: 900px) {
      #workspace { grid-template-columns: 1fr; }
      #splitter { display: none; }
      #outline { width: 170px; }
      #editorPane { border-right: 0; border-bottom: 1px solid var(--line); }
      body:not(.reader) #previewPane { display: none; }
      #fileName { max-width: 28vw; }
    }
  </style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <button id="openBtn">打开</button>
    <button id="saveBtn" class="primary">保存</button>
    <button id="saveAsBtn">另存为</button>
    <button id="registerBtn">注册到 Windows</button>
    <button id="unregisterBtn">取消注册</button>
    <div class="separator"></div>
    <button id="editModeBtn" class="mode active">编辑</button>
    <button id="readerModeBtn" class="mode">阅读</button>
    <button id="findBtn" title="Ctrl+F">查找</button>
    <button id="outlineBtn" aria-expanded="false">目录</button>
    <div id="fileName" title="">未命名.md</div>
  </div>

  <div id="findbar" hidden>
    <input id="findInput" type="text" aria-label="查找文本" placeholder="查找文本" />
    <span id="findCount" aria-live="polite">0 / 0</span>
    <button id="findPrev" aria-label="上一个匹配">↑</button>
    <button id="findNext" aria-label="下一个匹配">↓</button>
    <button id="findClose">关闭</button>
  </div>
  <div id="content">
  <nav id="outline" aria-label="文档目录" hidden></nav>
  <div id="workspace">
    <section id="editorPane"><textarea id="editor" spellcheck="false" aria-label="Markdown 编辑器"></textarea></section>
    <div id="splitter" role="separator" aria-label="调整编辑与预览宽度" aria-orientation="vertical" aria-valuemin="20" aria-valuemax="80" aria-valuenow="50" tabindex="0"></div>
    <section id="previewPane"><article id="preview"></article></section>
  </div>
  </div>

  <div id="statusbar">
    <span id="dirtyIndicator">已保存</span>
    <span id="encodingIndicator">UTF-8</span>
    <span id="eolIndicator">NONE</span>
    <span id="readOnlyIndicator" hidden>Read Only</span>
    <span id="message"></span>
  </div>
</div>

<script>
  const editor = document.getElementById('editor');
  const preview = document.getElementById('preview');
  const fileName = document.getElementById('fileName');
  const dirtyIndicator = document.getElementById('dirtyIndicator');
  const encodingIndicator = document.getElementById('encodingIndicator');
  const eolIndicator = document.getElementById('eolIndicator');
  const readOnlyIndicator = document.getElementById('readOnlyIndicator');
  const saveBtn = document.getElementById('saveBtn');
  const message = document.getElementById('message');
  const editModeBtn = document.getElementById('editModeBtn');
  const readerModeBtn = document.getElementById('readerModeBtn');
  const workspace = document.getElementById('workspace');
  const splitter = document.getElementById('splitter');
  const outline = document.getElementById('outline');
  const findbar = document.getElementById('findbar');
  const findInput = document.getElementById('findInput');
  let matches = [];
  let matchIndex = -1;

  function buildOutline() {
    outline.replaceChildren();
    preview.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach((heading) => {
      const button = document.createElement('button');
      button.textContent = heading.textContent;
      button.style.paddingLeft = `${8 + (Number(heading.tagName[1]) - 1) * 12}px`;
      button.addEventListener('click', () => {
        if (getComputedStyle(document.getElementById('previewPane')).display === 'none') setMode('reader');
        heading.scrollIntoView({ block: 'start' });
      });
      outline.append(button);
    });
    if (!outline.children.length) {
      const empty = document.createElement('p');
      empty.textContent = '当前文档没有标题';
      outline.append(empty);
    }
  }

  function updateSearch() {
    preview.querySelectorAll('mark[data-find]').forEach((mark) => mark.replaceWith(document.createTextNode(mark.textContent)));
    preview.normalize();
    matches = [];
    matchIndex = -1;
    const query = findInput.value.toLowerCase();
    if (!findbar.hidden && query) {
      if (!document.body.classList.contains('reader')) {
        const text = editor.value.toLowerCase();
        for (let pos = text.indexOf(query); pos !== -1; pos = text.indexOf(query, pos + query.length)) matches.push(pos);
      } else {
        const walker = document.createTreeWalker(preview, NodeFilter.SHOW_TEXT);
        const nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);
        nodes.forEach((node) => {
          const text = node.textContent;
          const lower = text.toLowerCase();
          const fragment = document.createDocumentFragment();
          let start = 0;
          for (let pos = lower.indexOf(query); pos !== -1; pos = lower.indexOf(query, start)) {
            fragment.append(document.createTextNode(text.slice(start, pos)));
            const mark = document.createElement('mark');
            mark.dataset.find = '';
            mark.textContent = text.slice(pos, pos + query.length);
            fragment.append(mark);
            matches.push(mark);
            start = pos + query.length;
          }
          fragment.append(document.createTextNode(text.slice(start)));
          node.replaceWith(fragment);
        });
      }
    }
    document.getElementById('findCount').textContent = `0 / ${matches.length}`;
    document.getElementById('findPrev').disabled = document.getElementById('findNext').disabled = !matches.length;
  }

  function moveMatch(direction) {
    if (!matches.length) return;
    if (matchIndex >= 0 && matches[matchIndex] instanceof Element) matches[matchIndex].classList.remove('current');
    matchIndex = (matchIndex + direction + matches.length) % matches.length;
    const match = matches[matchIndex];
    if (typeof match === 'number') {
      editor.focus();
      editor.setSelectionRange(match, match + findInput.value.length);
      // A mirror measures wrapped lines using the textarea's actual typography.
      const mirror = document.createElement('div');
      const style = getComputedStyle(editor);
      mirror.style.cssText = `position:absolute;visibility:hidden;white-space:pre-wrap;overflow-wrap:break-word;width:${editor.clientWidth}px;font:${style.font};padding:${style.padding};tab-size:${style.tabSize}`;
      mirror.textContent = editor.value.slice(0, match);
      const caret = document.createElement('span');
      caret.textContent = '\u200b';
      mirror.append(caret);
      document.body.append(mirror);
      editor.scrollTop = Math.max(0, caret.offsetTop - editor.clientHeight / 2);
      mirror.remove();
    } else {
      match.classList.add('current');
      match.scrollIntoView({ block: 'center' });
    }
    document.getElementById('findCount').textContent = `${matchIndex + 1} / ${matches.length}`;
  }

  function toggleFind(show) {
    findbar.hidden = !show;
    updateSearch();
    if (show) { findInput.focus(); findInput.select(); }
  }

  function setSplit(percent) {
    const value = Math.max(20, Math.min(80, percent));
    workspace.style.setProperty('--split', `${value}%`);
    splitter.setAttribute('aria-valuenow', Math.round(value));
  }
  splitter.addEventListener('pointerdown', (event) => {
    if (event.button !== 0) return;
    event.preventDefault();
    splitter.setPointerCapture(event.pointerId);
  });
  splitter.addEventListener('pointermove', (event) => {
    if (!splitter.hasPointerCapture(event.pointerId)) return;
    const rect = workspace.getBoundingClientRect();
    setSplit((event.clientX - rect.left) / rect.width * 100);
  });
  splitter.addEventListener('pointerup', (event) => {
    if (splitter.hasPointerCapture(event.pointerId)) splitter.releasePointerCapture(event.pointerId);
  });
  splitter.addEventListener('keydown', (event) => {
    if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
    event.preventDefault();
    setSplit(Number(splitter.getAttribute('aria-valuenow')) + (event.key === 'ArrowLeft' ? -5 : 5));
  });
  document.getElementById('outlineBtn').addEventListener('click', (event) => {
    outline.hidden = !outline.hidden;
    event.currentTarget.setAttribute('aria-expanded', !outline.hidden);
  });
  document.getElementById('findBtn').addEventListener('click', () => toggleFind(true));
  document.getElementById('findClose').addEventListener('click', () => toggleFind(false));
  document.getElementById('findPrev').addEventListener('click', () => moveMatch(matchIndex === -1 ? matches.length : -1));
  document.getElementById('findNext').addEventListener('click', () => moveMatch(1));
  findInput.addEventListener('input', updateSearch);
  findInput.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') { event.preventDefault(); moveMatch(event.shiftKey ? (matchIndex === -1 ? matches.length : -1) : 1); }
  });

  window.appState = {
    path: null,
    name: '未命名.md',
    lastSavedContent: '',
    dirty: false,
    renderToken: 0,
  };

  function setMessage(text = '', isError = false) {
    message.textContent = text;
    message.classList.toggle('error', isError);
  }

  function updateChrome() {
    const state = window.appState;
    fileName.textContent = (state.dirty ? '* ' : '') + state.name;
    fileName.title = state.path || state.name;
    dirtyIndicator.textContent = state.dirty ? '未保存' : '已保存';
    dirtyIndicator.classList.toggle('dirty', state.dirty);
    document.title = `${state.dirty ? '* ' : ''}${state.name} — Faithful Markdown`;
  }


  function applyFileFacts(doc) {
    encodingIndicator.textContent = doc.encoding || (doc.has_bom ? 'UTF-8 BOM' : 'UTF-8');
    eolIndicator.textContent = doc.eol_kind || 'NONE';
    readOnlyIndicator.hidden = !doc.read_only;
    editor.readOnly = saveBtn.disabled = Boolean(doc.read_only);
  }

  function applyDocument(doc) {
    window.appState.path = doc.path;
    window.appState.name = doc.name || '未命名.md';
    window.appState.dirty = false;
    editor.value = doc.content || '';
    window.appState.lastSavedContent = editor.value;
    applyFileFacts(doc);
    updateChrome();
    renderPreview();
    setMessage('');
  }

  async function renderPreview() {
    const token = ++window.appState.renderToken;
    const result = await window.pywebview.api.render(editor.value);
    if (token !== window.appState.renderToken) return;
    if (!result.ok) {
      setMessage(result.error || '渲染失败', true);
      return;
    }
    preview.innerHTML = result.html;
    wirePreviewLinks();
    buildOutline();
    updateSearch();
  }

  function wirePreviewLinks() {
    preview.querySelectorAll('a[href]').forEach((anchor) => {
      anchor.addEventListener('click', async (event) => {
        const href = anchor.getAttribute('href') || '';
        event.preventDefault();
        if (href.startsWith('http://') || href.startsWith('https://') || href.startsWith('mailto:')) {
          await window.pywebview.api.open_external(href);
        } else {
          setMessage('本地或相对链接暂不跳转，避免离开编辑器。');
        }
      });
    });
  }

  function confirmDiscardIfDirty() {
    if (!window.appState.dirty) return true;
    return window.confirm('当前文件有未保存修改。继续操作将丢弃这些修改，是否继续？');
  }

  async function openFile() {
    if (!confirmDiscardIfDirty()) return;
    const result = await window.pywebview.api.open_file();
    if (result.cancelled) return;
    if (!result.ok) return setMessage(result.error || '无法打开文件', true);
    applyDocument(result.document);
  }

  function markSaved(doc) {
    window.appState.path = doc.path;
    window.appState.name = doc.name || window.appState.name;
    window.appState.lastSavedContent = editor.value;
    window.appState.dirty = false;
    applyFileFacts(doc);
    updateChrome();
    renderPreview();
    setMessage('已保存');
  }

  async function saveFile() {
    const result = await window.pywebview.api.save(editor.value);
    if (result.cancelled) return;
    if (!result.ok) return setMessage(result.error || '保存失败', true);
    markSaved(result.document);
  }

  async function saveAsFile() {
    const result = await window.pywebview.api.save_as(editor.value);
    if (result.cancelled) return;
    if (!result.ok) return setMessage(result.error || '另存为失败', true);
    markSaved(result.document);
  }

  async function registerWindows() {
    const result = await window.pywebview.api.register_with_windows();
    setMessage(result.ok ? result.message : result.error, !result.ok);
  }

  async function unregisterWindows() {
    const result = await window.pywebview.api.unregister_from_windows();
    setMessage(result.ok ? result.message : result.error, !result.ok);
  }

  function setMode(mode) {
    const reader = mode === 'reader';
    document.body.classList.toggle('reader', reader);
    editModeBtn.classList.toggle('active', !reader);
    readerModeBtn.classList.toggle('active', reader);
    updateSearch();
  }

  let renderTimer = null;
  editor.addEventListener('input', () => {
    const wasDirty = window.appState.dirty;
    window.appState.dirty = editor.value !== window.appState.lastSavedContent;
    updateChrome();
    if (!findbar.hidden) updateSearch();
    if (wasDirty !== window.appState.dirty) {
      void window.pywebview.api.set_dirty(window.appState.dirty);
    }
    clearTimeout(renderTimer);
    renderTimer = setTimeout(renderPreview, 120);
  });

  document.getElementById('openBtn').addEventListener('click', openFile);
  document.getElementById('saveBtn').addEventListener('click', saveFile);
  document.getElementById('saveAsBtn').addEventListener('click', saveAsFile);
  document.getElementById('registerBtn').addEventListener('click', registerWindows);
  document.getElementById('unregisterBtn').addEventListener('click', unregisterWindows);
  editModeBtn.addEventListener('click', () => setMode('edit'));
  readerModeBtn.addEventListener('click', () => setMode('reader'));

  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && !findbar.hidden) { toggleFind(false); editor.focus(); return; }
    const cmd = event.ctrlKey || event.metaKey;
    if (!cmd) return;
    if (event.key.toLowerCase() === 'f') {
      event.preventDefault();
      toggleFind(true);
    } else if (event.key.toLowerCase() === 's') {
      event.preventDefault();
      event.shiftKey ? saveAsFile() : saveFile();
    } else if (event.key.toLowerCase() === 'o') {
      event.preventDefault();
      openFile();
    }
  });

  window.addEventListener('pywebviewready', async () => {
    const state = await window.pywebview.api.initial_state();
    applyDocument(state);
    if (state.startup_error) setMessage(state.startup_error, true);
    editor.focus();
  });
</script>
</body>
</html>
